<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byte & Brew — Blog Markdown-First</title>
    <meta name="description" content="Blog técnico y creativo con arquitectura Markdown-first." />
    <script>
      (() => {
        const saved = localStorage.getItem('bytebrew-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="prompt">bytebrew@blog:~$</span>
        <h1><a href="/">Byte & Brew</a></h1>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema">
          <img src="assets/icons/moon.svg" alt="" />
        </button>
        <button id="shareBtn" class="icon-btn" aria-label="Compartir post actual">
          <img src="assets/icons/share.svg" alt="" />
        </button>
      </div>
    </header>

    <main class="layout">
      <aside class="left-rail card">
        <label for="searchInput">Buscar</label>
        <input id="searchInput" type="search" placeholder="Filtrar por título o tags..." />
        <nav aria-label="Lista de posts">
          <ul id="postList" class="post-list"></ul>
        </nav>
      </aside>

      <article class="content card" id="postContainer" aria-live="polite">
        <header>
          <p class="muted" id="postMeta"></p>
          <h2 id="postTitle">Cargando...</h2>
          <p id="postDescription"></p>
        </header>
        <img id="postCover" class="cover hidden" alt="Portada del artículo" loading="lazy" decoding="async" />
        <section id="postBody"></section>
        <footer class="post-footer">
          <nav class="prev-next" aria-label="Navegación entre posts">
            <a id="prevPost" href="#"></a>
            <a id="nextPost" href="#"></a>
          </nav>
          <section id="giscusContainer" class="comments"></section>
        </footer>
      </article>

      <aside class="right-rail card">
        <h3>Contenido</h3>
        <nav aria-label="Tabla de contenidos">
          <ul id="tocList" class="toc-list"></ul>
        </nav>
      </aside>
    </main>

    <button id="backToTop" class="floating hidden" aria-label="Volver arriba">
      <img src="assets/icons/up.svg" alt="" />
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
